# Change these first
owner: beotam # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: BeoTam Main
    url: https://beotam.com
  - name: BeoTam Admin
    url: https://admin.beotam.com
  - name: BeoTam Media
    url: https://media.beotam.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: BeoTam Status
  introTitle: "**BeoTam Services** Real-time Uptime Monitor"
  introMessage: Hệ thống theo dõi trạng thái hoạt động tự động của các dịch vụ BeoTam (beotam.com, admin.beotam.com, media.beotam.com).
  navbar:
    - title: Status
      href: /upptime/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

